name: 학원 스케줄 아침 요약 + 하원 알림 예약

on:
  schedule:
    # 매일 아침 7시 KST = 전날 22:00 UTC (kinder-notify.yml 과 동일 타이밍)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '연습 실행 (Slack 발송 안 함)'
        type: boolean
        default: false
      date:
        description: '테스트용 — 이 날짜인 척한다 (YYYY-MM-DD, 비우면 오늘)'
        type: string
        default: ''
      pickup_in:
        description: '테스트용 — 하원 알림을 지금부터 N분 뒤로 예약 (비우면 하원 30분 전)'
        type: string
        default: ''

jobs:
  notify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kinder-academy
    steps:
      - uses: actions/checkout@v4

      - name: Firebase 서비스 계정 키 복원
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > firebase-service-account.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/kinder-academy/requirements.txt

      - run: pip install -r requirements.txt

      - name: 아침 요약 발송 + 하원 알림 예약
        env:
          # 봇 토큰이 있으면 chat.postMessage 로 보내고 하원 알림을 예약한다.
          # 없으면 웹훅으로 요약만 보내고 예약은 건너뛴다.
          SLACK_BOT_TOKEN_ACADEMY: ${{ secrets.SLACK_BOT_TOKEN_ACADEMY }}
          SLACK_CHANNEL_ACADEMY: ${{ secrets.SLACK_CHANNEL_ACADEMY }}
          SLACK_WEBHOOK_URL_ACADEMY: ${{ secrets.SLACK_WEBHOOK_URL_ACADEMY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 아이 이름 문구. 저장소가 공개라 소스가 아니라 secret 으로 넣는다.
          ACADEMY_KIDS_LABEL: ${{ secrets.ACADEMY_KIDS_LABEL }}
        run: |
          python3 notify_daily.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.pickup_in && format('--pickup-in {0}', inputs.pickup_in) || '' }}
