name: 학원 스케줄 아침 요약

on:
  schedule:
    # 매일 아침 7시 KST = 전날 22:00 UTC (kinder-notify.yml 과 동일 타이밍)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '연습 실행 (Slack 발송 안 함)'
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kinder-academy
    steps:
      - uses: actions/checkout@v4

      - name: Firebase 서비스 계정 키 복원
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > firebase-service-account.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/kinder-academy/requirements.txt

      - run: pip install -r requirements.txt

      - name: 아침 요약 발송
        env:
          SLACK_WEBHOOK_URL_ACADEMY: ${{ secrets.SLACK_WEBHOOK_URL_ACADEMY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 notify_daily.py ${{ inputs.dry_run && '--dry-run' || '' }}
