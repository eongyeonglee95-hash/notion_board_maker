name: 학원 하원 임박 알림

on:
  schedule:
    # 5분마다 요청하지만 GitHub 은 실제로 20~50분 간격으로만 돌려준다(측정값).
    # 그래서 판정 창을 35분으로 넓게 잡고, 중복은 Firestore 발송기록으로 막는다.
    # 시간대는 UTC 0~13시 = KST 09~22시. 학원이 없는 새벽에는 돌리지 않는다.
    - cron: '*/5 0-13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '연습 실행 (Slack 발송 안 함)'
        type: boolean
        default: false
      now:
        description: '테스트용 — 지금이 이 시각인 척한다 (YYYY-MM-DDTHH:MM, KST)'
        type: string
        default: ''

jobs:
  notify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kinder-academy
    steps:
      - uses: actions/checkout@v4

      - name: Firebase 서비스 계정 키 복원
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > firebase-service-account.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/kinder-academy/requirements.txt

      - run: pip install -r requirements.txt

      - name: 임박 알림 확인 및 발송
        env:
          SLACK_WEBHOOK_URL_ACADEMY: ${{ secrets.SLACK_WEBHOOK_URL_ACADEMY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 아이 이름 문구. 저장소가 공개라 소스가 아니라 secret 으로 넣는다.
          ACADEMY_KIDS_LABEL: ${{ secrets.ACADEMY_KIDS_LABEL }}
        run: |
          python3 notify_imminent.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.now && format('--now {0}', inputs.now) || '' }}
