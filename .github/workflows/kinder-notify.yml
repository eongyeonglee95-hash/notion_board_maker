name: 유치원 일정 슬랙 알림

on:
  schedule:
    # 매일 아침 7시 KST = 전날 22:00 UTC
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '연습 실행 (Slack 발송 안 함)'
        type: boolean
        default: false
      date:
        description: '테스트용 — 이 날짜인 척한다 (YYYY-MM-DD, 비우면 오늘)'
        type: string
        default: ''

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: config.json 복원
        env:
          KINDER_CONFIG_JSON: ${{ secrets.KINDER_CONFIG_JSON }}
        run: echo "$KINDER_CONFIG_JSON" > apps/kinder-schedule/config.json

      - name: 지난 날짜 항목 취소선 표시
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 apps/kinder-schedule/mark_past_due.py

      - name: 알림 확인 및 발송
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 apps/kinder-schedule/notify.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: 캘린더(ICS) 구독용 Gist 갱신
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python3 apps/kinder-schedule/build_ics.py > /tmp/kinder-schedule.ics
          gh gist edit "${{ secrets.GIST_ID }}" --filename kinder-schedule.ics /tmp/kinder-schedule.ics
